name: Extension CI

on:
  push:
  pull_request:

concurrency:
  group: extension-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension-quality:
    name: Extension quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Validate manifest policy
        run: npm run validate:manifest

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run unpacked-extension E2E
        run: xvfb-run -a npm run test:e2e
